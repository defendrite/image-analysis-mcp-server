[package]
name = "image-analysis-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.8", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server"
] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1"
schemars = "1"
image = {
    version = "0.25",
    default-features = false,
    features = ["jpeg", "png", "webp"]
}
